<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BEKANTOR Private AI</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="app">

    <header>
      <h1>BEKANTOR</h1>
      <p>Private AI</p>
      <span>NODE #0000</span>
    </header>

    <section class="import-panel" aria-labelledby="import-title">
      <div>
        <h2 id="import-title">Datos de farmacia</h2>
        <p>Importá un CSV local para comenzar. Los datos permanecen en este nodo.</p>
      </div>
      <form id="import-form" class="import-form">
        <input id="csv-file" type="file" accept=".csv,text/csv" required>
        <button type="submit">Importar CSV</button>
      </form>
      <p id="import-status" class="import-status">Aún no hay datos importados.</p>
    </section>

    <section id="chat" class="chat">
      <div class="message assistant">
        BEKANTOR NODE conectado. ¿En qué puedo ayudarte?
      </div>
    </section>

    <form id="chat-form">
      <input
        id="message-input"
        type="text"
        placeholder="Escribí un mensaje..."
        autocomplete="off"
        required
      >

      <button type="submit">
        Enviar
      </button>
    </form>

  </main>

  <script src="app.js"></script>

</body>
</html>
